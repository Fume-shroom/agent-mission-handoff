name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist staging

          package_tar() {
            local os="$1"
            local arch="$2"
            local asset_arch="$3"
            local package_dir="staging/${os}-${arch}"
            mkdir -p "$package_dir/skills/mission-handoff"
            CGO_ENABLED=0 GOOS="${os,,}" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=$GITHUB_REF_NAME" -o "$package_dir/amh" ./cmd/amh
            cp skills/mission-handoff/SKILL.md "$package_dir/skills/mission-handoff/SKILL.md"
            tar -C "$package_dir" -czf "dist/amh_${os}_${asset_arch}.tar.gz" amh skills
          }

          package_tar Darwin amd64 x86_64
          package_tar Darwin arm64 arm64
          package_tar Linux amd64 x86_64
          package_tar Linux arm64 arm64

          package_windows() {
            local arch="$1"
            local asset_arch="$2"
            local package_dir="staging/Windows-${arch}"
            mkdir -p "$package_dir/skills/mission-handoff"
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=$GITHUB_REF_NAME" -o "$package_dir/amh.exe" ./cmd/amh
            cp skills/mission-handoff/SKILL.md "$package_dir/skills/mission-handoff/SKILL.md"
            (cd "$package_dir" && zip -qr "../../dist/amh_Windows_${asset_arch}.zip" amh.exe skills)
          }

          package_windows amd64 x86_64
          package_windows arm64 arm64

          (cd dist && sha256sum amh_* > checksums.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "AMH $GITHUB_REF_NAME"
          fi
